services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: voice
      MYSQL_PASSWORD: voice
      MYSQL_DATABASE: voice_commerce
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:8080
      DB_PROVIDER: sqlite
    depends_on:
      - mysql
  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
volumes:
  mysql-data:
